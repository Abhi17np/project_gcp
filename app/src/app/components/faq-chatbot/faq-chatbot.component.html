<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

  <!-- Chat Panel -->
  <div
    *ngIf="isOpen"
    class="w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 flex flex-col overflow-hidden"
    style="max-height: 32rem;"
  >
    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <div>
          <p class="text-white font-semibold text-sm leading-tight">HiYrNow Assistant</p>
          <p class="text-white/70 text-xs">Usually answers instantly</p>
        </div>
      </div>
      <button
        (click)="toggle()"
        class="text-white/80 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10"
        aria-label="Close chat"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Message thread -->
    <div #messageList class="flex-1 overflow-y-auto p-4 space-y-3 min-h-0">
      <div
        *ngFor="let msg of messages"
        [ngClass]="msg.from === 'user' ? 'flex justify-end' : 'flex justify-start'"
      >
        <div
          [ngClass]="msg.from === 'user'
            ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white'
            : 'bg-gray-100 text-gray-800'"
          class="max-w-[78%] px-3 py-2 rounded-xl text-sm leading-relaxed"
        >
          {{ msg.text }}
        </div>
      </div>
    </div>

    <!-- Escalation form -->
    <div
      *ngIf="showEscalationForm"
      class="px-4 py-3 bg-indigo-50 border-t border-indigo-100 space-y-2 flex-shrink-0"
    >
      <p class="text-xs font-semibold text-indigo-700">Connect with our team</p>
      <p class="text-xs text-gray-500 bg-white border border-gray-200 rounded-lg px-2 py-1.5 line-clamp-2">
        "{{ escalationQuestion }}"
      </p>
      <input
        [(ngModel)]="escalationName"
        type="text"
        placeholder="Your name"
        class="w-full text-sm px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100"
      />
      <input
        [(ngModel)]="escalationEmail"
        type="email"
        placeholder="Your email"
        class="w-full text-sm px-3 py-2 rounded-lg border border-gray-200 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100"
      />
      <button
        (click)="submitEscalation()"
        [disabled]="isSubmitting || !escalationName.trim() || !escalationEmail.trim()"
        class="w-full py-2 bg-gradient-to-r from-indigo-600 to-violet-600 text-white text-sm font-semibold rounded-lg hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ isSubmitting ? 'Sending…' : 'Send to Team' }}
      </button>
    </div>

    <!-- Input area -->
    <div class="px-3 py-3 border-t border-gray-100 flex gap-2 items-center flex-shrink-0">
      <input
        [(ngModel)]="userInput"
        (keydown)="onKeydown($event)"
        type="text"
        placeholder="Ask a question…"
        class="flex-1 text-sm px-3 py-2 rounded-xl border border-gray-200 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-100"
      />
      <button
        (click)="sendMessage()"
        aria-label="Send"
        class="w-9 h-9 flex-shrink-0 flex items-center justify-center bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-xl hover:opacity-90 transition-opacity"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Toggle button -->
  <button
    (click)="toggle()"
    aria-label="Toggle chat"
    class="w-14 h-14 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg hover:shadow-xl hover:opacity-90 transition-all duration-300 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2"
  >
    <svg *ngIf="!isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
    <svg *ngIf="isOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

</div>
